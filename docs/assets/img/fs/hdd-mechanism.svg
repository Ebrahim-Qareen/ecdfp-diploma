<g opacity="0"><circle cx="548.0" cy="317.0" r="30" fill="#22d3ee" opacity="0.22"/><circle cx="548.0" cy="317.0" r="15" fill="none" stroke="#22d3ee" stroke-width="2.5"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000;0.735000;0.750000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
</g>
<text class="hdd-t hdd-lbl" x="46" y="432">Platter</text>
<path class="hdd-lead" d="M52,440 L168,424"/>
<text class="hdd-t hdd-lbl" x="190" y="168">Sector</text>
<path class="hdd-lead" d="M196,176 L290,240"/>
<text class="hdd-t hdd-lbl" x="228" y="542">Spindle</text>
<path class="hdd-lead" d="M234,550 L378,458"/>
<text class="hdd-t hdd-lbl" x="122" y="626">Track</text>
<path class="hdd-lead" d="M128,634 L308,580"/>
<text class="hdd-t hdd-lbl" x="556" y="122">Park ramp</text>
<path class="hdd-lead" d="M562,130 L680,158"/>
<text class="hdd-t hdd-lbl" x="762" y="248">Read/write head</text>
<path class="hdd-lead" d="M768,256 L734,210"/>
<text class="hdd-t hdd-lbl" x="668" y="608">Actuator arm</text>
<path class="hdd-lead" d="M674,616 L842,574"/>
<rect class="hdd-panel" x="1046" y="86" width="490" height="600" rx="14"/>
<text class="hdd-t hdd-hd" x="1072" y="128">Side view - the stack</text>
<text class="hdd-t hdd-mut" x="1072" y="156">Why a cylinder is not a track</text>
<rect x="1284" y="196" width="18" height="330" fill="#4a5461" stroke="#6b788a" stroke-width="1.5"/>
<ellipse cx="1293" cy="250" rx="188" ry="26" fill="#2a333f" stroke="#4d5a69" stroke-width="2"/>
<path d="M1516,244 L1376,244 L1376,256 L1516,256 Z" fill="url(#hddArm)" stroke="#7b8798" stroke-width="1.5"/>
<rect x="1364" y="239" width="22" height="16" rx="4" fill="#cdd6e0"/>
<ellipse cx="1293" cy="360" rx="188" ry="26" fill="#2a333f" stroke="#4d5a69" stroke-width="2"/>
<path d="M1516,354 L1376,354 L1376,366 L1516,366 Z" fill="url(#hddArm)" stroke="#7b8798" stroke-width="1.5"/>
<rect x="1364" y="349" width="22" height="16" rx="4" fill="#cdd6e0"/>
<ellipse cx="1293" cy="470" rx="188" ry="26" fill="#2a333f" stroke="#4d5a69" stroke-width="2"/>
<path d="M1516,464 L1376,464 L1376,476 L1516,476 Z" fill="url(#hddArm)" stroke="#7b8798" stroke-width="1.5"/>
<rect x="1364" y="459" width="22" height="16" rx="4" fill="#cdd6e0"/>
<g opacity="0">
<ellipse cx="1161" cy="250" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<ellipse cx="1425" cy="250" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<ellipse cx="1161" cy="360" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<ellipse cx="1425" cy="360" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<ellipse cx="1161" cy="470" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<ellipse cx="1425" cy="470" rx="15" ry="7" fill="#22d3ee" opacity="0.55"/>
<line x1="1161" y1="240" x2="1161" y2="480" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1425" y1="240" x2="1425" y2="480" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6"/>
<text class="hdd-t hdd-lbl" x="1196" y="556" fill="#22d3ee">One cylinder</text>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000;0.485000;0.500000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/>
</g>
<text class="hdd-t hdd-mut" x="1072" y="600">All heads move together on one actuator,</text>
<text class="hdd-t hdd-mut" x="1072" y="624">so the same track number on every surface</text>
<text class="hdd-t hdd-mut" x="1072" y="648">is reachable without another seek.</text>
<rect class="hdd-panel" x="24" y="706" width="1512" height="98" rx="14"/>
<g opacity="0"><text class="hdd-t hdd-cap" x="60" y="754">Idle - heads parked on the ramp, clear of the platter surface</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.000000;0.125000;0.140000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
<g opacity="0"><text class="hdd-t hdd-cap" x="60" y="754">Spin-up - platters must reach full RPM before any read is possible</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000000;0.110000;0.125000;0.291667;0.306667;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
<g opacity="0"><text class="hdd-t hdd-cap" x="60" y="754">Seek - the actuator swings the whole head stack to the target track</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000000;0.276667;0.291667;0.500000;0.515000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
<g opacity="0"><text class="hdd-t hdd-cap" x="60" y="754">Rotational latency - the drive waits for the target sector to arrive</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000000;0.485000;0.500000;0.750000;0.765000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
<g opacity="0"><text class="hdd-t hdd-cap" x="60" y="754">Read - the head senses flux reversals and the controller decodes bits</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000;0.735000;0.750000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/></g>
<text class="hdd-t hdd-mut" x="60" y="786">Forensic consequence: seek time plus rotational latency is why a full physical image of a spinning disk takes hours - and why a head crash destroys specific tracks, not the whole disk.</text>
<g id="hddPlay" class="svg-play" role="button" tabindex="0" aria-label="Play the hard disk read sequence" style="cursor:pointer">
<rect x="1330" y="30" width="206" height="44" rx="10" fill="#152030" stroke="#22d3ee" stroke-width="1.5"/>
<path d="M1358,42 L1380,52 L1358,62 Z" fill="#22d3ee"/>
<text class="hdd-t hdd-lbl" x="1394" y="59" fill="#22d3ee">Play / Replay</text>
</g>
</svg>
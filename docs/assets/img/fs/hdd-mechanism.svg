<line x1="451.8" y1="424.7" x2="559.4" y2="434.4" stroke="#3f4a58" stroke-width="1.5"/>
</g></g>
</g>
<circle cx="400.0" cy="420.0" r="52" fill="#39434f" stroke="#5b6775" stroke-width="2"/>
<circle cx="400.0" cy="420.0" r="18" fill="#5b6775"/>

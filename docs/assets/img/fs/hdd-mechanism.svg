<g id="hddArmG" transform="rotate(28.0 880.0 600.0)">
<animateTransform attributeName="transform" type="rotate" values="28.0 880.0 600.0;28.0 880.0 600.0;6.0 880.0 600.0;6.0 880.0 600.0;0.0 880.0 600.0;0.0 880.0 600.0" keyTimes="0.000000;0.291667;0.383333;0.433333;0.500000;1.000000" dur="12s" begin="hddPlay.click" restart="always" calcMode="linear"/>

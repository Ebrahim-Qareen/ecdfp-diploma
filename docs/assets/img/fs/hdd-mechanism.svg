<stop offset="0%" stop-color="#3b4654"/><stop offset="60%" stop-color="#2a333f"/>
<stop offset="100%" stop-color="#1d242e"/></radialGradient>
<linearGradient id="hddArm" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#6b788a"/><stop offset="100%" stop-color="#4a5461"/></linearGradient>
<clipPath id="hddClip"><circle cx="420" cy="380" r="290"/></clipPath>

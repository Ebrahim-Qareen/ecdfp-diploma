<svg viewBox="0 0 1560 830" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet" aria-label="How a hard disk drive reads a sector: spin-up, seek, rotational latency, read. Right panel shows a cylinder as the same track across every platter surface." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
